# Railway service configuration for the FastAPI backend.
#
# This file tells Railway:
#   - Which Dockerfile to use (the one in this directory)
#   - Where the application listens (port 8000)
#   - Health check endpoint
#
# Environment variables (DATABASE_URL, CORS_ORIGINS) are configured
# in the Railway dashboard — never stored here.

[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "./entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
